name: Deploy backend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-porto-backend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Pull and restart backend
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'REMOTE_COMMANDS'
            set -e
            cd /home/debian/DevProjects/my-porto-backend
            git fetch origin main --prune
            git checkout main || git checkout -B main origin/main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml build
            attempt=1
            until docker compose -f docker-compose.prod.yml run --rm -T backend npm run db:migrate </dev/null; do
              if [ "$attempt" -ge 12 ]; then
                echo "Database migration failed after $attempt attempts."
                exit 1
              fi
              echo "Database is not ready; retrying migration in 5 seconds (attempt $((attempt + 1))/12)."
              sleep 5
              attempt=$((attempt + 1))
            done
            docker compose -f docker-compose.prod.yml up -d --wait --remove-orphans
            docker compose -f docker-compose.prod.yml ps
            docker compose -f docker-compose.prod.yml exec -T backend node --input-type=module -e "const response = await fetch('http://localhost:3000/health'); if (!response.ok) process.exit(1); console.log(await response.text())"
          REMOTE_COMMANDS
