name: Deploy backend to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: my-porto-backend-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Trust VPS host key
        run: ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> "$HOME/.ssh/known_hosts"

      - name: Deploy with zero-downtime
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" << 'REMOTE_COMMANDS'
            set -e
            cd /home/debian/DevProjects/my-porto-backend

            echo "Pulling latest code..."
            git fetch origin main --prune
            git checkout main || git checkout -B main origin/main
            git reset --hard origin/main

            # Old container name
            OLD_NAME="my-porto-backend"
            NEW_NAME="my-porto-backend-$(date +%s)"

            echo "Building new image..."
            docker compose -f docker-compose.prod.yml build my-porto-backend

            echo "Running database migrations..."
            attempt=1
            until docker compose -f docker-compose.prod.yml run --rm --no-deps -T my-porto-backend npm run db:migrate </dev/null; do
              if [ "$attempt" -ge 12 ]; then
                echo "Migration failed after $attempt attempts."
                exit 1
              fi
              echo "DB not ready; retrying in 5 seconds (attempt $((attempt + 1))/12)..."
              sleep 5
              attempt=$((attempt + 1))
            done

            echo "Starting new container: $NEW_NAME"
            docker compose -f docker-compose.prod.yml run -d --no-deps --name "$NEW_NAME" my-porto-backend

            echo "Waiting for healthcheck..."
            STATUS="starting"
            for i in $(seq 1 30); do
              STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$NEW_NAME" 2>/dev/null || echo "starting")

              if [ "$STATUS" = "healthy" ]; then
                echo "New container is healthy!"
                break
              fi

              if [ "$STATUS" = "unhealthy" ]; then
                echo "New container is unhealthy. Rolling back..."
                docker logs "$NEW_NAME" --tail 50 || true
                docker rm -f "$NEW_NAME" || true
                exit 1
              fi

              sleep 2
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "Timeout waiting for healthcheck. Rolling back..."
              docker rm -f "$NEW_NAME" || true
              exit 1
            fi

            echo "Reloading Caddy..."
            docker exec ninisrv-caddy caddy reload --config /etc/caddy/Caddyfile || true

            echo "Stopping old container..."
            docker rm -f "$OLD_NAME" || true

            echo "Renaming new container..."
            docker rename "$NEW_NAME" "$OLD_NAME"

            echo "Deployment complete."
            docker compose -f docker-compose.prod.yml ps
          REMOTE_COMMANDS
